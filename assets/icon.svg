<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Adapted from micro:bit Educational Foundation artwork; redrawn with cable, heart and shading.
       Source: https://github.com/microbit-foundation/microbit-svg/blob/master/microbit-drawing-2.svg
       CC BY-NC-SA 4.0: https://creativecommons.org/licenses/by-nc-sa/4.0/ -->
  <title>micro:bit Manager: ready to connect</title>
  <desc>A close crop of a micro:bit with a USB cable aligned above its socket, ready to connect. All artwork is editable vector geometry.</desc>
  <defs>
    <linearGradient id="board-edge" x1="0" y1="226" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#393f34"/><stop offset=".025" stop-color="#2f362d"/>
      <stop offset=".07" stop-color="#293029"/><stop offset="1" stop-color="#282e29"/>
    </linearGradient>
    <linearGradient id="board-surface" x1="120" y1="234" x2="404" y2="536" gradientUnits="userSpaceOnUse">
      <stop stop-color="#212628"/><stop offset=".48" stop-color="#1e2325"/><stop offset="1" stop-color="#1c2123"/>
    </linearGradient>
    <linearGradient id="green-print" x1="0" y1="238" x2="165" y2="315" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16d276"/><stop offset="1" stop-color="#0ecd6e"/>
    </linearGradient>
    <linearGradient id="gold" x1="224" y1="275" x2="282" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecd075"/><stop offset=".3" stop-color="#e8ca6c"/>
      <stop offset=".65" stop-color="#e3c465"/><stop offset="1" stop-color="#ebce72"/>
    </linearGradient>
    <linearGradient id="cable-rubber" x1="235" y1="0" x2="277" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a333b"/><stop offset=".27" stop-color="#333d46"/>
      <stop offset=".52" stop-color="#303a43"/><stop offset="1" stop-color="#2a333b"/>
    </linearGradient>
    <linearGradient id="plug-rubber" x1="208" y1="70" x2="304" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f3a43"/><stop offset=".28" stop-color="#2c3740"/>
      <stop offset=".8" stop-color="#28323a"/><stop offset="1" stop-color="#263038"/>
    </linearGradient>
    <linearGradient id="metal" x1="221" y1="0" x2="291" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9c4ca"/><stop offset=".08" stop-color="#cdd7dc"/>
      <stop offset=".18" stop-color="#d2dbe0"/><stop offset=".35" stop-color="#c7d1d7"/>
      <stop offset=".72" stop-color="#ccd6db"/><stop offset=".93" stop-color="#bfccd2"/>
      <stop offset="1" stop-color="#b5c1ca"/>
    </linearGradient>
    <linearGradient id="socket-metal" x1="214" y1="0" x2="298" y2="0" gradientUnits="userSpaceOnUse">
