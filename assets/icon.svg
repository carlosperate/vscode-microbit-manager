      <path d="M216 216Q216 213 220 213H292Q296 213 296 216V234H216Z" fill="url(#socket-metal)" stroke="#79858b" stroke-width=".8"/>
      <path d="M222 213H250L253 215H259L262 213H290" stroke="#eef2f3" stroke-width="1.2"/>
