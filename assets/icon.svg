        <circle cx="246" cy="98" r="2.5" fill="#82919b" stroke="none"/>
        <path d="M264 99H270V104H264Z" fill="#82919b" stroke="none"/>
        <circle cx="256" cy="126" r="3" fill="#82919b" stroke="none"/>
