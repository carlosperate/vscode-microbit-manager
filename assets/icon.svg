        <use href="#lit-led" x="176" y="443"/><use href="#lit-led" x="216" y="443"/><use href="#lit-led" x="256" y="443"/><use href="#lit-led" x="296" y="443"/><use href="#lit-led" x="336" y="443"/>
        <use href="#lit-led" x="216" y="483"/><use href="#lit-led" x="256" y="483"/><use href="#lit-led" x="296" y="483"/>
        <use href="#lit-led" x="256" y="523"/>
