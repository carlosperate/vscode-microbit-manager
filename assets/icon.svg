      <path d="M232 46H280Q291 46 296 59L302 78V144Q302 159 287 159H225Q210 159 210 144V78L216 59Q221 46 232 46Z" fill="url(#plug-rubber)" stroke="#101820" stroke-width="2"/>
      <path d="M215 141V79L221 60Q225 51 234 51H278Q287 51 291 61" stroke="#73808a" stroke-opacity=".45" stroke-width="1.5"/>
      <path d="M216 149Q218 155 229 155H284Q295 155 297 147" stroke="#080f14" stroke-width="2"/>
      <path d="M218 84V134M294 84V134" stroke="#0d171e" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
      <g id="usb-symbol" transform="translate(0 -2)" stroke="#82919b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
